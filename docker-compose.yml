# Three services:
#   devnet  - local Starknet node (always on while you work)
#   cairo   - Scarb + Starknet Foundry toolchain (run on demand: `docker compose run --rm cairo scarb build`)
#   tests   - Node 22 running the TypeScript tests against devnet (run on demand)
#
# The `tools` and `test` profiles keep cairo/tests from starting with a plain `docker compose up`.
#
# DOCKER_UID / DOCKER_GID: on Linux, scripts/compose.mjs sets these to your own uid/gid so the
# files these containers write are yours. Unset (root) is right for Docker Desktop on Windows/macOS.

services:
  devnet:
    image: shardlabs/starknet-devnet-rs:0.10.0
    command:
      - --seed=0
      - --port=5050
      - --accounts=5
      - --initial-balance=1000000000000000000000000
      # Web explorer at http://127.0.0.1:5050/ui - off unless asked for.
      - --ui
      # Lets a browser wallet (ArgentX) deploy one of its own accounts here.
      - --predeclare-argent
    ports:
      - "5050:5050"

  cairo:
    build: ./docker/cairo
    image: bilateral-escrow/cairo
    profiles: ["tools"]
    working_dir: /work/contracts
    environment:
      DOCKER_UID: ${DOCKER_UID:-0}
      DOCKER_GID: ${DOCKER_GID:-0}
    volumes:
      - ./contracts:/work/contracts
      - scarb-cache:/root/.cache/scarb

  tests:
    build: ./docker/tests
    image: bilateral-escrow/tests
    profiles: ["test"]
    working_dir: /work/tests
    environment:
      RPC_URL: http://devnet:5050/rpc
      DOCKER_UID: ${DOCKER_UID:-0}
      DOCKER_GID: ${DOCKER_GID:-0}
    depends_on:
      - devnet
    volumes:
      - ./contracts/target:/work/contracts/target:ro
      - ./tests:/work/tests
      # Deployment records must land on the host, not inside a --rm container.
      - ./deployments:/work/deployments
      # Linux node_modules live in a volume so they never mix with a Windows install.
      - node_modules:/work/tests/node_modules

volumes:
  scarb-cache:
  node_modules:
